# Local environment for a SightPress project.
#
#   docker compose up                      app on http://localhost:8080, plus Mailpit and MinIO
#   docker compose --profile mysql up      also start MySQL   (or: mariadb, postgres)
#
# A plain `docker compose up` starts no database: the site registry uses SQLite by default, and sites can use
# SQLite or an external database server. Settings come from `.env` (copy `.env.example`); every one has a default.

x-env-file: &env-file
  env_file:
    - path: .env
      required: false

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    <<: *env-file
    environment:
      APP_ENV: ${APP_ENV:-dev}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      # Path repositories (see composer.json): Composer links vendor/sightpress/* to these sibling folders.
      - ../core:/core:ro
      - ../module-interface:/module-interface:ro
    depends_on:
      mailpit:
        condition: service_started
      minio:
        condition: service_started

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started

  # Catches every e-mail the app sends. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # S3-compatible object storage for media. Console: http://localhost:9001
  # The official MinIO images are no longer published; pgsty/minio is a maintained community build of MinIO.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    <<: *env-file
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sightpress}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sightpress-secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # Optional databases: start one with `--profile mysql`, `--profile mariadb` or `--profile postgres`.
  # They are only reachable from the other containers (host name = service name).
  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sightpress}
      MYSQL_USER: ${DB_USER:-sightpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sightpress}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sightpress-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mariadb:
    profiles: ["mariadb"]
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-sightpress}
      MARIADB_USER: ${DB_USER:-sightpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-sightpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sightpress-root}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    profiles: ["postgres"]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sightpress}
      POSTGRES_USER: ${DB_USER:-sightpress}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sightpress}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  minio-data:
  mysql-data:
  mariadb-data:
  postgres-data:
